# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure (Handwritten)
      run: >
        cmake
        -B ${{ github.workspace }}/build-handwritten
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCPPRE_USE_PARSER_COMB=OFF

    - name: Build (Handwritten)
      run: >
        cmake --build
        ${{ github.workspace }}/build-handwritten
        --config ${{ env.BUILD_TYPE }}

    - name: Test (Handwritten)
      working-directory: ${{ github.workspace }}/build-handwritten
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

    - name: Configure (ParserComb)
      run: >
        cmake
        -B ${{ github.workspace }}/build-parsercomb
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCPPRE_USE_PARSER_COMB=ON

    - name: Build (ParserComb)
      run: >
        cmake --build
        ${{ github.workspace }}/build-parsercomb
        --config ${{ env.BUILD_TYPE }}

    - name: Test (ParserComb)
      working-directory: ${{ github.workspace }}/build-parsercomb
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure
